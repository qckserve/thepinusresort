<!doctype html>
<html lang="en">
<head>
  <!-- include:head -->
  <title>Rate your stay | The Pinus Resort</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    .stars { display: flex; justify-content: center; gap: 6px; margin: 28px 0 8px; }
    .stars button { width: 52px; height: 52px; display: grid; place-items: center; color: var(--line); transition: color .15s, transform .15s; }
    .stars button svg { width: 40px; height: 40px; fill: currentColor; stroke: none; }
    .stars button.on { color: var(--wood); }
    .stars button:hover { transform: scale(1.08); }
    .stars-label { min-height: 24px; text-align: center; font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--muted); }
  </style>
</head>
<body>
  <!-- include:header -->
  <main id="main">
    <section class="section">
      <div class="container container--narrow">
        <div class="panel center" data-review>
          <p class="eyebrow">Thank you for staying with us</p>
          <h1 class="h2 mt-s" data-title>How was your stay?</h1>
          <p class="lede center mt-s" data-sub>Loading your booking...</p>
          <form class="stack" data-form hidden style="text-align:left;max-width:560px;margin:0 auto">
            <div class="stars" role="radiogroup" aria-label="Your rating" data-stars></div>
            <p class="stars-label" data-label aria-live="polite"></p>
            <div class="field">
              <label for="rv-comment">Tell us more <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
              <textarea id="rv-comment" name="comment" maxlength="2000" placeholder="What did you enjoy? What could we do better?"></textarea>
            </div>
            <div class="form-status is-error" data-status hidden></div>
            <div class="btn-row" style="justify-content:center"><button class="btn" type="submit" data-submit>Send review</button></div>
          </form>
          <div data-done hidden class="stack mt-m"></div>
        </div>
      </div>
    </section>
  </main>
  <!-- include:footer -->
  <script type="module">
    const $ = (s) => document.querySelector(s);
    const token = new URLSearchParams(location.search).get('t') || '';
    const words = ['', 'Poor', 'Could be better', 'Good', 'Very good', 'Wonderful'];
    const star = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
    let rating = 0;
    const stars = $('[data-stars]');
    stars.innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="false" aria-label="${n} star${n > 1 ? 's' : ''}, ${words[n]}" data-n="${n}">${star}</button>`).join('');
    const paint = (n) => stars.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.n <= n));
    stars.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      rating = +b.dataset.n; paint(rating);
      stars.querySelectorAll('button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
      $('[data-label]').textContent = words[rating];
    });
    stars.addEventListener('mouseover', (e) => { const b = e.target.closest('button'); if (b) paint(+b.dataset.n); });
    stars.addEventListener('mouseleave', () => paint(rating));

    const nice = (d) => new Date(`${d}T00:00:00`).toLocaleDateString('en-IN', { day: 'numeric', month: 'long' });
    try {
      const r = await fetch(`/api/review?t=${encodeURIComponent(token)}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      $('[data-title]').textContent = `How was your stay, ${d.name}?`;
      $('[data-sub]').textContent = `${nice(d.checkIn)} to ${nice(d.checkOut)}. One tap on the stars, and a few words if you like.`;
      $('[data-form]').hidden = false;
      if (d.rated) { rating = d.rated; paint(rating); $('[data-label]').textContent = `You rated us ${d.rated} of 5. You can change it.`; }
    } catch (e) {
      $('[data-sub]').textContent = e.message || 'This review link is not valid.';
    }

    $('[data-form]').addEventListener('submit', async (e) => {
      e.preventDefault();
      const st = $('[data-status]'); st.hidden = true;
      if (!rating) { st.textContent = 'Please choose 1 to 5 stars.'; st.hidden = false; return; }
      $('[data-submit]').disabled = true;
      try {
        const r = await fetch('/api/reviews', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, rating, comment: e.target.comment.value }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        $('[data-form]').hidden = true;
        $('[data-sub]').hidden = true;
        $('[data-title]').textContent = 'Thank you';
        const done = $('[data-done]');
        done.hidden = false;
        done.innerHTML = `<p class="lede center">Your review means a lot to our small team.</p>${d.shareUrl ? `<p class="lede center">Would you share it on Google too? It helps other travellers find us.</p><div class="btn-row" style="justify-content:center"><a class="btn" href="${d.shareUrl}" target="_blank" rel="noopener">Post on Google</a></div>` : ''}<div class="btn-row" style="justify-content:center"><a class="link-u" href="/">Back to the website</a></div>`;
      } catch (err) {
        st.textContent = err.message || 'Could not send. Please try again.'; st.hidden = false;
        $('[data-submit]').disabled = false;
      }
    });
  </script>
</body>
</html>
