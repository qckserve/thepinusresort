<a class="skip-link" href="#main">Skip to content</a>
<!-- include:icons -->
<div class="topbar">
  <div class="container topbar__inner">
    <div class="topbar__group">
      <a class="topbar__addr" href="{{site.mapsUrl}}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-pin"/></svg>Nunwan, Pahalgam, Kashmir</a>
      <a class="topbar__mail" href="mailto:{{site.email}}"><svg class="icon"><use href="#i-mail"/></svg>{{site.email}}</a>
    </div>
    <div class="topbar__group">
      <a href="tel:{{site.phoneHref}}"><svg class="icon"><use href="#i-phone"/></svg>{{site.phone}}</a>
      <a class="topbar__wa" href="https://wa.me/{{site.whatsapp}}" target="_blank" rel="noopener" data-wa><svg class="icon"><use href="#i-whatsapp"/></svg>WhatsApp</a>
    </div>
  </div>
</div>
<header class="header" data-header>
  <div class="container header__inner">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="drawer" data-menu-open>
      <span class="menu-toggle__bars" aria-hidden="true"></span><span class="menu-toggle__label">Menu</span>
    </button>
    <nav class="nav" aria-label="Primary">
      <a href="/about/"{{current:about}}>About</a>
      <a href="/accommodation/"{{current:accommodation}}>Accommodation</a>
      <a href="/activities/"{{current:activities}}>Experiences</a>
    </nav>
    <a class="brand" href="/" aria-label="The Pinus Resort, home">
      <img class="brand__full" src="/logo.png" alt="The Pinus Resort, a home in the heart of pines" width="269" height="269" fetchpriority="high">
      <img class="brand__emblem" src="/logo-emblem.png" alt="" width="269" height="218" aria-hidden="true">
    </a>
    <nav class="nav nav--right" aria-label="Secondary">
      <a href="/gallery/"{{current:gallery}}>Gallery</a>
      <a href="/contact/"{{current:contact}}>Contact</a>
      <a class="btn" href="/reservation/"{{current:reservation}}>Reserve</a>
    </nav>
    <a class="btn header__book" href="/reservation/">Reserve</a>
  </div>
</header>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Menu" data-drawer>
  <div class="drawer__top">
    <img src="/logo-cream-emblem.png" alt="" width="64" height="52" style="height:52px;width:auto">
    <button class="drawer__close" type="button" data-menu-close>Close <svg class="icon"><use href="#i-close"/></svg></button>
  </div>
  <nav class="drawer__nav" aria-label="Mobile">
    <a href="/"{{current:home}}>Home</a>
    <a href="/about/"{{current:about}}>About</a>
    <a href="/accommodation/"{{current:accommodation}}>Accommodation</a>
    <a href="/activities/"{{current:activities}}>Experiences</a>
    <a href="/gallery/"{{current:gallery}}>Gallery</a>
    <a href="/contact/"{{current:contact}}>Contact</a>
  </nav>
  <div class="drawer__foot">
    <a class="btn btn--light" href="/reservation/">Reserve your stay</a>
    <a href="tel:{{site.phoneHref}}"><svg class="icon"><use href="#i-phone"/></svg>{{site.phone}}</a>
    <a href="mailto:{{site.email}}"><svg class="icon"><use href="#i-mail"/></svg>{{site.email}}</a>
  </div>
</div>
